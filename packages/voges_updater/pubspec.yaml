name: voges_updater
description: "Voges Updater: finds and installs updates for the Voges apps."
publish_to: 'none'

# The helper's own version; release builds pass --build-name with the version
# of the app that embeds it.
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  crypto: ^3.0.8
  cryptography: ^2.9.0
  path: ^1.9.1
  url_launcher: ^6.3.3
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
